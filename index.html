<!DOCTYPE html>
<html lang="en">
<head>

        video { transform: scaleX(-1); } /* Flip for mirror view */
        img { width: 200px; margin: 5px; }
        #results { margin-top: 20px; }
        .result-item { border: 1px solid #ccc; padding: 10px; }

</head>

</body>
<script src="app.js"></script>
</html>
